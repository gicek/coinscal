name: tests

# Local equivalents are listed in docs/DEVELOPMENT.md.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: No build artifacts or secrets in the source tree
        run: |
          found="$(git ls-files | grep -E '(^|/)(\.build|DerivedData|\.gradle|\.kotlin|node_modules|\.next|\.open-next|Build)/' || true)"
          if [ -n "$found" ]; then echo "These build artifacts are committed:"; echo "$found"; exit 1; fi
          secrets="$(git ls-files | grep -E '(^|/)(local\.mk|\.env(\.[^/]*)?|\.dev\.vars)$|\.(p8|p12|cer|mobileprovision|jks|keystore)$' | grep -v '\.example$' || true)"
          if [ -n "$secrets" ]; then echo "These possible secrets / local config files are committed:"; echo "$secrets"; exit 1; fi

  i18n:
    name: Localization guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Three Mac string guards
        # Same as the i18n step in make test-mac
        run: python3 scripts/i18n-guard.py --langs "en,zh-Hans,zh-Hant" --min-files 20 --platform apple --root Apple/Mac --extra Apple/MacWidget
      - name: Release notes
        # Same as the release notes step in make test-mac
        run: python3 scripts/release/publish.py --check-notes docs/release-notes
      - name: Release script tests
        run: make test-release
      - name: Three website string guards
        # Same as the i18n step in make test-site
        run: python3 scripts/i18n-guard.py --langs "en,zh-Hans,zh-Hant" --min-files 7 --platform web --root Site

  site:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Offline checks
        # Same as the npm step in make test-site; the site has no dependencies to install
        run: npm run check
        working-directory: Site

  mac:
    name: macOS build and tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned XcodeGen
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$PWD/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build app and widget and run Swift tests
        run: make test-mac
      - name: Check that the generated project is current
        run: git diff --exit-code -- Apple/Coinscal.xcodeproj
